services:
  mongo:
    image: mongo:7
    container_name: afisha-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./test/mongodb_initial_stub.json:/seed/films.json:ro

  postgres:
    image: postgres:16
    container_name: afisha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: afisha
      POSTGRES_PASSWORD: afisha
      POSTGRES_DB: afisha
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
volumes:
  mongo-data:
  postgres-data: