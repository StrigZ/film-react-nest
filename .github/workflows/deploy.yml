name: Deploy

on:
  push:
    branches:
      - review
      - main
   
permissions:
   packages: write
   contents: read
jobs:
   build-and-push:
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@v4

         - uses: docker/setup-buildx-action@v3             
      
         - uses: docker/login-action@v3
           with:
               registry: ghcr.io
               username: ${{ github.actor }}
               password: ${{ secrets.GITHUB_TOKEN }}
            
         - uses: docker/build-push-action@v5
           name: Build backend
           with:
               context: ./backend
               push: ${{ github.ref == 'refs/heads/main' }}
               tags: |
                    ghcr.io/strigz/film-react-nest-backend:latest
                    ghcr.io/strigz/film-react-nest-backend:${{ github.sha }}

         - uses: docker/build-push-action@v5
           name: Build frontend
           with:
            context: ./frontend
            push: ${{ github.ref == 'refs/heads/main' }}
            tags: | 
                  ghcr.io/strigz/film-react-nest-frontend:latest 
                  ghcr.io/strigz/film-react-nest-frontend:${{ github.sha }}

         - uses: docker/build-push-action@v5
           name: Build nginx
           with:
            context: ./nginx
            push: ${{ github.ref == 'refs/heads/main' }}
            tags: | 
                  ghcr.io/strigz/film-react-nest-nginx:latest
                  ghcr.io/strigz/film-react-nest-nginx:${{ github.sha }}

      
